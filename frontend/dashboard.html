<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                Admin Panel
            </div>

           <nav>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="#usersSection">Users</a>
</nav>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </aside>

        <!-- Add User Modal -->
<div class="modal" id="addUserModal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Add New User</h2>

            <button type="button" id="closeModalBtn">
                ×
            </button>
        </div>

        <form id="addUserForm">

            <div class="form-group">
                <label for="userName">Name</label>
                <input
                    type="text"
                    id="userName"
                    required
                >
            </div>

            <div class="form-group">
                <label for="userEmail">Email</label>
                <input
                    type="email"
                    id="userEmail"
                    required
                >
            </div>

            <div class="form-group">
                <label for="userPhone">Phone</label>
                <input
                    type="text"
                    id="userPhone"
                >
            </div>

            <div class="form-group">
                <label for="userAddress">Address</label>
                <input
                    type="text"
                    id="userAddress"
                >
            </div>

            <div class="form-group">
                <label for="userRole">Role</label>

                <select id="userRole">
                    <option value="User">User</option>
                    <option value="Admin">Admin</option>
                    <option value="Editor">Editor</option>
                </select>
            </div>

            <button type="submit">
                Add User
            </button>

            <div id="addUserMessage"></div>

        </form>

    </div>

</div>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Top Header -->
            <header class="topbar">

                <div>
                    <h1>Dashboard</h1>
                    <p>Manage your users and records</p>
                </div>

                <div class="admin-info">
                    <span id="adminName">Admin</span>
                </div>

            </header>


            <!-- Statistics -->
            <section class="stats">

                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p id="totalUsers">0</p>
                </div>

                <div class="stat-card">
                    <h3>Users  Records</h3>
                    <p id="activeRecords">0</p>
                </div>

            </section>


            <!-- Users Section -->
           <section class="users-section" id="usersSection"></section>

                <div class="section-header">

                    <div>
                        <h2>Users</h2>
                        <p>View and manage registered users</p>
                    </div>

                    <button id="addUserBtn">
                        + Add User
                    </button>

                </div>


                <!-- Search -->
                <div class="search-box">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search user by name or email..."
                    >

                    <button id="searchBtn">
                        Search
                    </button>

                </div>


                <!-- Users Table -->
                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="usersTableBody">
                            <!-- Users will be loaded here -->
                        </tbody>

                    </table>

                </div>

            </section>


            <!-- User Details -->
            <section class="user-details" id="userDetails">

                <h2>Selected User</h2>

                <p>Select a user from the table to view details.</p>

            </section>

        </main>

    </div>


    <script src="js/dashboard.js"></script>

</body>
</html>
